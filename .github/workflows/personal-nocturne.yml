name: Personal Nocturne

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Check official releases or build the current personal branch
        type: choice
        options: [check, build]
        default: check
  push:
    branches: [personal/nocturne]
  pull_request:
    branches: [personal/nocturne]

permissions:
  contents: read

concurrency:
  group: personal-nocturne-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: >-
      github.repository == 'JackBewley/nocturne' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      clean: ${{ steps.check.outputs.clean }}
      ref: ${{ steps.check.outputs.ref }}
      pr: ${{ steps.check.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal/nocturne
          fetch-depth: 0
      - name: Prepare upstream release PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/personal/check-release.py "$RUNNER_TEMP/check-release.py"
          python3 "$RUNNER_TEMP/check-release.py"

  build:
    needs: discover
    if: >-
      always() && github.repository == 'JackBewley/nocturne' &&
      ((needs.discover.outputs.changed == 'true' && needs.discover.outputs.clean == 'true') ||
       github.event_name == 'push' || github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'build'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      packaged: ${{ steps.package.outputs.packaged }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.ref || (github.event_name == 'workflow_dispatch' && 'personal/nocturne') || github.sha }}
          persist-credentials: false
      - name: Record source commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check automation scripts
        run: |
          python3 -m unittest discover -s tools/personal -p 'test_*.py'
          bash -n tools/personal/install-latest.sh
          sh -n tools/personal/install-device.sh
      - name: Test and build UI
        working-directory: packages/ui
        run: |
          bun test
          bun run build
      - name: Package reviewed personal build
        id: package
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/personal/nocturne') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'build')
        run: python3 tools/personal/package.py
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.packaged == 'true'
        with:
          name: personal-ui-package
          path: personal-dist/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [discover, build]
    if: always() && needs.discover.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Attach verification result
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.discover.outputs.pr }}
          RESULT: ${{ needs.build.result }}
        run: |
          gh pr comment "$PR" --repo JackBewley/nocturne --body "UI verification: **$RESULT**. Details: https://github.com/JackBewley/nocturne/actions/runs/$GITHUB_RUN_ID. Firmware compatibility review is still required before packaging."

  publish:
    needs: build
    if: >-
      always() && needs.build.result == 'success' && needs.build.outputs.packaged == 'true' &&
      github.repository == 'JackBewley/nocturne' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/personal/nocturne') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'build'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-ui-package
          path: release
      - name: Publish approved UI package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE: ${{ needs.build.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo JackBewley/nocturne >/dev/null 2>&1; then
            echo "Release already published: $TAG"
          else
            gh release create "$TAG" release/personal-ui-bundle.tar.gz release/SHA256SUMS \
              --repo JackBewley/nocturne --target "$SOURCE" --title "Personal Nocturne $TAG" \
              --notes-file release/RELEASE.md --latest
          fi
